<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Wiener Home View</title>
    <style>
        /* Modernes helles Design mit einem edlen, fließenden Wellenmuster */
        body {
            background-color: #f5f7fa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(240, 244, 248, 1) 0px, transparent 50%),
                radial-gradient(at 50% 0%, rgba(228, 237, 245, 1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(240, 244, 248, 1) 0px, transparent 50%),
                linear-gradient(135deg, #e6eef8 0%, #f5f7fa 100%);
            color: #1C1C1E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            font-weight: 300;
            margin-bottom: 5px;
            color: #1C1C1E;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #48484A;
            margin-bottom: 30px;
        }

        /* Stabiles Tabellen-Layout für iOS 9 Safari */
        .dashboard-table {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            border-spacing: 15px;
        }

        /* Weiche, moderne Kacheln mit feinem iOS-Schatten */
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            vertical-align: top;
            width: 50%;
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #007AFF; /* iOS Blau */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Größere und schönere Uhrzeit */
        .time-display {
            font-size: 64px;
            font-weight: 200;
            color: #1C1C1E;
            margin: 5px 0;
            letter-spacing: -1px;
        }

        .date-display {
            font-size: 16px;
            color: #007AFF;
            font-weight: 500;
        }

        /* Buttons (behalten für Notfälle) */
        .btn {
            display: block;
            background-color: #E5E5EA;
            color: #1C1C1E;
            text-decoration: none;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
        }

        /* CSS Anpassung für die eingebetteten Widgets */
        .widget-frame {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: transparent;
        }
    </style>
</head>
<body>

    <h1>Servus in Döbling</h1>
    <div class="subtitle">Dein persönliches iPad Dashboard</div>

    <table class="dashboard-table">
        <tr>
            <!-- Kachel 1: Uhrzeit & Datum (Vergrößert) -->
            <td class="card">
                <h2>Zeit & Datum</h2>
                <div id="uhr" class="time-display">--:--</div>
                <div id="datum" class="date-display">Lädt...</div>
            </td>

            <!-- Kachel 2: Wetter Döbling via robustem Iframe-Widget -->
            <td class="card" style="padding: 15px;">
                <h2>Wetter 1190 Wien</h2>
                <!-- Dieses Widget lädt unabhängig und zeigt sofort Grad + Text (sonnig, bewölkt etc.) -->
                <iframe class="widget-frame" src="https://wetter.de" height="150" scrolling="no"></iframe>
            </td>
        </tr>
        <tr>
            <!-- Kachel 3: Top Schlagzeilen Live-Widget (Kein externes Öffnen nötig) -->
            <td class="card">
                <h2>Top News Österreich</h2>
                <!-- Lädt die aktuellsten Kurier/ORF-Schlagzeilen direkt lesbar als Liste in die Kachel -->
                <iframe class="widget-frame" src="https://nachrichten.at" height="200" style="background: white; border: 1px solid #E5E5EA;"></iframe>
            </td>

            <!-- Kachel 4: Tageszitat -->
            <td class="card" style="vertical-align: middle;">
                <h2>Tagesfokus</h2>
                <p style="font-style: italic; color: #3A3A3C; line-height: 1.5; font-size: 18px; margin: 0 10px;">
                    "Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."
                </p>
            </td>
        </tr>
    </table>

    <script>
        // LIVE-UHRZEIT & DATUM
        function aktualisiereUhr() {
            var jetzt = new Date();
            var stunden = jetzt.getHours();
            var minuten = jetzt.getMinutes();
            
            if (stunden < 10) stunden = "0" + stunden;
            if (minuten < 10) minuten = "0" + minuten;
            
            document.getElementById('uhr').innerHTML = stunden + ":" + minuten;
            
            var optionen = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('datum').innerHTML = jetzt.toLocaleDateString('de-AT', optionen);
        }
        
        // Jede Sekunde aktualisieren
        setInterval(aktualisiereUhr, 1000);
        aktualisiereUhr();
    </script>

</body>
</html>
