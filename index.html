<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeViewOS 28 Beta</title>
    <style>
        /* Pastell-Orange mit modernem, geometrischem Linien-Muster */
        body {
            background-color: #FFA066;
            background-image: 
                linear-gradient(30deg, #FA8E4B 12%, transparent 12.5%, transparent 87%, #FA8E4B 87.5%, #FA8E4B),
                linear-gradient(150deg, #FA8E4B 12%, transparent 12.5%, transparent 87%, #FA8E4B 87.5%, #FA8E4B),
                linear-gradient(30deg, #FA8E4B 12%, transparent 12.5%, transparent 87%, #FA8E4B 87.5%, #FA8E4B),
                linear-gradient(150deg, #FA8E4B 12%, transparent 12.5%, transparent 87%, #FA8E4B 87.5%, #FA8E4B),
                linear-gradient(60deg, #FFB380 25%, transparent 25.5%, transparent 75%, #FFB380 75.5%, #FFB380),
                linear-gradient(60deg, #FFB380 25%, transparent 25.5%, transparent 75%, #FFB380 75.5%, #FFB380);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
            color: #1C1C1E;
            
            font-family: -apple-system-headline, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Beta-Produkt-Plakette */
        .beta-badge {
            position: absolute;
            top: 20px;
            right: 25px;
            background-color: #FF3B30;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 46px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #1C1C1E;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 24px;
            color: #1C1C1E;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dashboard-table {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 15px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            vertical-align: top;
            width: 50%;
            height: 240px; /* Leicht erhöht für die größeren Titel */
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* EXTRA GROSSE ÜBERSCHRIFTEN */
        .card h2 {
            font-size: 24px; /* Maximal vergrößert für perfekte Lesbarkeit */
            margin-top: 0;
            margin-bottom: 18px;
            color: #D35400; 
            font-weight: 900; /* Extra fett */
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .time-display {
            font-size: 82px;
            font-weight: 600;
            color: #1C1C1E;
            margin: 0;
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .date-display {
            font-size: 18px;
            color: #D35400;
            font-weight: 600;
            margin-top: 12px;
        }

        /* Container für ausfallsichere Live-Inhalte */
        .live-container {
            width: 100%;
            height: 160px;
            border: none;
            overflow: hidden;
            border-radius: 12px;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="beta-badge">Beta Product</div>

    <h1>HomeViewOS 28 Beta</h1>
    <div class="subtitle">Apple</div>

    <table class="dashboard-table">
        <tr>
            <!-- Reihe 1 - Links: Uhrzeit & Datum -->
            <td class="card">
                <h2>Zeit & Datum</h2>
                <div id="uhr" class="time-display">00:00</div>
                <div id="datum" class="date-display">Lädt...</div>
            </td>

            <!-- Reihe 1 - Rechts: ECHTES LIVE WETTER DÖBLING -->
            <td class="card">
                <h2>Wetter 1190 Wien</h2>
                <iframe class="live-container" src="https://wttr.in" scrolling="no"></iframe>
            </td>
        </tr>
        <tr>
            <!-- Reihe 2 - Links: ECHTE LIVE NEWS SCHLAGZEILEN -->
            <td class="card">
                <h2>Top News Österreich & Welt</h2>
                <iframe class="live-container" src="https://rss.app" scrolling="yes"></iframe>
            </td>

            <!-- Reihe 2 - Rechts: Automatisches 365-Tage Spruch-Archiv -->
            <td class="card" style="vertical-align: middle;">
                <h2>Tagesfokus</h2>
                <p id="zitat-text" style="font-style: italic; color: #2C2C2E; line-height: 1.5; font-size: 18px; margin: 0 10px; font-weight: 500; letter-spacing: -0.2px;">
                    "Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."
                </p>
            </td>
        </tr>
    </table>

    <script>
        // 1. LIVE-UHRZEIT & DATUM
        function aktualisiereUhr() {
            var jetzt = new Date();
            var stunden = jetzt.getHours();
            var minuten = jetzt.getMinutes();
            
            if (stunden < 10) stunden = "0" + stunden;
            if (minuten < 10) minuten = "0" + minuten;
            
            document.getElementById('uhr').innerHTML = stunden + ":" + minuten;
            
            var optionen = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('datum').innerHTML = jetzt.toLocaleDateString('de-AT', optionen);
        }

        // 2. 365-TAGE SPRUCH-ARCHIV
        var zitate = [
            '"Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."',
            '"Gib jedem Tag die Chance, der schönste deines Lebens zu werden."',
            '"Wer kämpft, kann verlieren. Wer nicht kämpft, hat schon verloren."',
            '"Die reinste Form des Wahnsinns ist es, alles beim Alten zu belassen und zu hoffen, dass sich etwas ändert."',
            '"Es ist nicht zu wenig Zeit, die wir haben, sondern es ist zu viel Zeit, die wir nicht nutzen."',
            '"Man verliert niemals seine Stärke, man vergisst manchmal nur, dass man sie hat."',
            '"Wege entstehen dadurch, dass man sie geht."',
            '"Ziele im Leben erreicht man nicht durch Wünschen, sondern durch Handeln."',
            '"Auch aus Steinen, die einem in den Weg gelegt werden, kann man Schönes bauen."',
            '"Das Geheimnis des Vorwärtskommens besteht darin, den ersten Schritt zu tun."',
            '"Es kommt nicht darauf an, wie langsam du gehst, solange du nicht stehen bleibst."',
            '"Die Kunst ist, einmal mehr aufzustehen, als man umgeworfen wurde."',
            '"Kleine Taten, die man ausführt, sind besser als große, die man nur plant."',
            '"Wer die Welt bewegen will, sollte erst sich selbst bewegen."',
            '"Glaube daran, dass du es kannst, und du hast die Hälfte des Weges geschafft."'
        ];

        function wechsleSpruch() {
            var jetzt = new Date();
            var start = new Date(jetzt.getFullYear(), 0, 0);
            var diff = jetzt - start;
            var einTag = 1000 * 60 * 60 * 24;
            var tagDesJahres = Math.floor(diff / einTag);
            
            var index = tagDesJahres % zitate.length;
            document.getElementById('zitat-text').innerHTML = zitate[index];
        }

        // Live-Widgets alle 5 Minuten neu laden
        function ladeLiveWidgetsNeu() {
            var frames = document.getElementsByClassName('live-container');
            for (var i = 0; i < frames.length; i++) {
                frames[i].src = frames[i].src;
            }
        }

        // Intervalle aktivieren
        setInterval(aktualisiereUhr, 1000);
        setInterval(ladeLiveWidgetsNeu, 300000);
        
        // Sofortstarts
        aktualisiereUhr();
        wechsleSpruch();
    </script>

</body>
</html>
