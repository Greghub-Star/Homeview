<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Home View</title>
    <style>
        /* Modernes, dunkles Design (schont das alte Display) */
        body {
            background-color: #121212;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            font-weight: 300;
            margin-bottom: 5px;
            color: #E5E5EA;
        }

        .subtitle {
            font-size: 18px;
            color: #8E8E93;
            margin-bottom: 40px;
        }

        /* Altes Layout-System (Tabellen), das auf iOS 9 perfekt funktioniert */
        .dashboard-table {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            border-spacing: 15px; /* Abstand zwischen den Kacheln */
        }

        /* Stylische, moderne Kacheln */
        .card {
            background-color: #1C1C1E;
            border-radius: 16px; /* Abgerundete Ecken wie bei modernen iOS-Widgets */
            padding: 25px;
            text-align: center;
            vertical-align: top;
            width: 50%;
        }

        .card h2 {
            font-size: 20px;
            margin-top: 0;
            color: #0A84FF; /* iOS Blau */
            font-weight: 500;
        }

        /* Uhr-Styling */
        .time-display {
            font-size: 48px;
            font-weight: bold;
            color: #30D158; /* iOS Grün */
            margin: 10px 0;
        }

        /* Buttons im Widget */
        .btn {
            display: block;
            background-color: #2C2C2E;
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-weight: 500;
            font-size: 16px;
        }

        /* Wetter-Dummy-Text */
        .weather-text {
            font-size: 24px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>Guten Morgen</h1>
    <div class="subtitle">Willkommen auf deinem iPad Home View</div>

    <!-- Haupt-Dashboard -->
    <table class="dashboard-table">
        <tr>
            <!-- Kachel 1: Uhrzeit & Datum -->
            <td class="card">
                <h2>Zeit & Datum</h2>
                <!-- Das iPad Mini 1 aktualisiert diese Uhr jede Sekunde automatisch -->
                <div id="uhr" class="time-display">00:00</div>
                <div id="datum" style="color: #8E8E93;">1. Jänner 2026</div>
            </td>

            <!-- Kachel 2: Wetter-Station -->
            <td class="card">
                <h2>Wetter</h2>
                <div class="weather-text">☀️ 22°C</div>
                <div style="color: #8E8E93;">Sonnig in Wien</div>
            </td>
        </tr>
        <tr>
            <!-- Kachel 3: Deine Favoriten -->
            <td class="card">
                <h2>Schnellstart</h2>
                <a href="https://youtube.com" class="btn" target="_blank">📺 YouTube</a>
                <a href="https://wikipedia.org" class="btn" target="_blank">🌐 Wikipedia</a>
            </td>

            <!-- Kachel 4: Tageszitat / Notiz -->
            <td class="card">
                <h2>Tagesfokus</h2>
                <p style="font-style: italic; color: #AEAEB2; line-height: 1.4;">
                    "Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."
                </p>
            </td>
        </tr>
    </table>

    <!-- Einfaches, altes JavaScript für die Live-Uhrzeit (läuft super auf iOS 9) -->
    <script>
        function aktualisiereUhr() {
            var jetzt = new Date();
            var stunden = jetzt.getHours();
            var minuten = jetzt.getMinutes();
            
            // Führende Null hinzufügen, wenn einstellig
            if (stunden < 10) stunden = "0" + stunden;
            if (minuten < 10) minuten = "0" + minuten;
            
            document.getElementById('uhr').innerHTML = stunden + ":" + minuten;
            
            // Datum anzeigen
            var optionen = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('datum').innerHTML = jetzt.toLocaleDateString('de-DE', optionen);
        }
        
        // Jede Sekunde aktualisieren
        setInterval(aktualisiereUhr, 1000);
        aktualisiereUhr(); // Sofort beim Start ausführen
    </script>

</body>
</html>
