<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home View OS</title>
    <style>
        /* Modernes, maskulineres Pastell-Orange mit klarem, geometrischem Streifenmuster */
        body {
            background-color: #F7D6C8;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.15) 50%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.15) 50%, transparent 50%);
            background-size: 30px 30px;
            color: #2C2C2E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #1C1C1E;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #48484A;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Fixiertes Tabellen-Layout: Erzwingt die richtige widget-Reihenfolge unter iOS 9 */
        .dashboard-table {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 15px;
        }

        /* Cleane, weiße Kacheln */
        .card {
            background-color: rgba(255, 255, 255, 0.94);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            vertical-align: top;
            width: 50%;
            height: 200px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card h2 {
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 12px;
            color: #D96B43; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Fette Uhrzeit */
        .time-display {
            font-size: 72px;
            font-weight: 700;
            color: #1C1C1E;
            margin: 5px 0 0 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .date-display {
            font-size: 15px;
            color: #D96B43;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Widget Iframe-Container */
        .widget-iframe {
            width: 100%;
            height: 150px;
            border: none;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Home View OS</h1>
    <div class="subtitle">Apple</div>

    <table class="dashboard-table">
        <tr>
            <!-- Reihe 1 - Links: Uhrzeit & Datum (Jetzt fest verankert) -->
            <td class="card">
                <h2>Zeit & Datum</h2>
                <div id="uhr" class="time-display">--:--</div>
                <div id="datum" class="date-display">Lädt...</div>
            </td>

            <!-- Reihe 1 - Rechts: Wetter Döbling via sicherer Feed-Brücke -->
            <td class="card">
                <h2>Wetter 1190 Wien</h2>
                <iframe class="widget-iframe" src="https://mikle.com" scrolling="no"></iframe>
            </td>
        </tr>
        <tr>
            <!-- Reihe 2 - Links: Nativer ORF RSS-Feed ohne Blockade-Risiko -->
            <td class="card">
                <h2>Top News Österreich & Welt</h2>
                <iframe class="widget-iframe" src="https://mikle.com" scrolling="yes"></iframe>
            </td>

            <!-- Reihe 2 - Rechts: Automatischer Spruch-Wechsler -->
            <td class="card" style="vertical-align: middle;">
                <h2>Tagesfokus</h2>
                <p id="zitat-text" style="font-style: italic; color: #2C2C2E; line-height: 1.5; font-size: 17px; margin: 0 10px; font-weight: 500;">
                    "Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."
                </p>
            </td>
        </tr>
    </table>

    <script>
        // 1. LIVE-UHRZEIT & DATUM
        function aktualisiereUhr() {
            var jetzt = new Date();
            var stunden = jetzt.getHours();
            var minuten = jetz.getMinutes();
            if (stunden < 10) stunden = "0" + stunden;
            if (minuten < 10) minuten = "0" + minuten;
            document.getElementById('uhr').innerHTML = stunden + ":" + minuten;
            
            var optionen = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('datum').innerHTML = jetzt.toLocaleDateString('de-AT', optionen);
        }

        // 2. AUTOMATISCHER SPRUCH-WECHSLER (Jede Halbe Stunde neu)
        var zitate = [
            '"Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."',
            '"Gib jedem Tag die Chance, der schönste deines Lebens zu werden."',
            '"Wer kämpft, kann verlieren. Wer nicht kämpft, hat schon verloren."',
            '"Die reinste Form des Wahnsinns ist es, alles beim Alten zu belassen und zu hoffen, dass sich etwas ändert."',
            '"Es ist nicht zu wenig Zeit, die wir haben, sondern es ist zu viel Zeit, die wir nicht nutzen."'
        ];

        function wechsleSpruch() {
            var stunde = new Date().getHours();
            // Wählt anhand der aktuellen Stunde mathematisch ein Zitat aus der Liste aus
            var index = stunde % zitate.length;
            document.getElementById('zitat-text').innerHTML = zitate[index];
        }

        // Intervalle aktivieren
        setInterval(aktualisiereUhr, 1000);
        setInterval(wechsleSpruch, 3600000); // Genau alle 60 Minuten (3.600.000 ms)
        
        // Sofortstarts
        aktualisiereUhr();
        wechsleSpruch();
    </script>

</body>
</html>
