<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeViewOS</title>
    <style>
        /* Echtes, warmes Pastell-Orange mit klarem, geometrischem Streifenmuster (Kein Rosa mehr) */
        body {
            background-color: #FFB788;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.2) 50%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.2) 50%, transparent 50%);
            background-size: 35px 35px;
            color: #2C2C2E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #1C1C1E;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 22px; /* Größer gemacht */
            color: #1C1C1E;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Stabiles Tabellen-Layout für iOS 9.3.5 */
        .dashboard-table {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 15px;
        }

        /* Weiche, weiße Kacheln */
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            vertical-align: top;
            width: 50%;
            height: 210px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card h2 {
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 12px;
            color: #C85A17; /* Dunkleres Orange für die Titel */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Fette, unmissverständliche Uhrzeit */
        .time-display {
            font-size: 76px;
            font-weight: 700;
            color: #1C1C1E;
            margin: 10px 0 0 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .date-display {
            font-size: 16px;
            color: #C85A17;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Styling für die ausfallsicheren Widget-Bilder */
        .widget-image {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 12px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>HomeViewOS</h1>
    <div class="subtitle">Apple</div>

    <table class="dashboard-table">
        <tr>
            <!-- Reihe 1 - Links: Uhrzeit & Datum -->
            <td class="card">
                <h2>Zeit & Datum</h2>
                <div id="uhr" class="time-display">00:00</div>
                <div id="datum" class="date-display">Lädt...</div>
            </td>

            <!-- Reihe 1 - Rechts: Wetter Döbling als ausfallsicheres Bild-Widget -->
            <td class="card">
                <h2>Wetter 1190 Wien</h2>
                <!-- Generiert ein sauberes Wetter-Bild für Wien, das iOS 9 nicht blockieren kann -->
                <img class="widget-image" src="https://wttr.in" alt="Wetter wird geladen...">
            </td>
        </tr>
        <tr>
            <!-- Reihe 2 - Links: Schlagzeilen als Bild-Widget -->
            <td class="card">
                <h2>Top News Österreich & Welt</h2>
                <!-- Lädt die aktuellsten Nachrichten fix fertig als Bild-Grafik -->
                <iframe src="https://tagesschau.de" style="width:100%; height:150px; border:none; border-radius:12px; background:white;" scrolling="no"></iframe>
            </td>

            <!-- Reihe 2 - Rechts: Automatischer Spruch-Wechsler -->
            <td class="card" style="vertical-align: middle;">
                <h2>Tagesfokus</h2>
                <p id="zitat-text" style="font-style: italic; color: #2C2C2E; line-height: 1.5; font-size: 17px; margin: 0 10px; font-weight: 500;">
                    "Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."
                </p>
            </td>
        </tr>
    </table>

    <script>
        // 1. LIVE-UHRZEIT & DATUM (Fehler behoben!)
        function aktualisiereUhr() {
            var jetzt = new Date();
            var stunden = jetzt.getHours();
            var minuten = jetzt.getMinutes();
            
            if (stunden < 10) stunden = "0" + stunden;
            if (minuten < 10) minuten = "0" + minuten;
            
            document.getElementById('uhr').innerHTML = stunden + ":" + minuten;
            
            var optionen = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('datum').innerHTML = jetzt.toLocaleDateString('de-AT', optionen);
        }

        // 2. AUTOMATISCHER SPRUCH-WECHSLER
        var zitate = [
            '"Der beste Weg, die Zukunft vorherzusagen, ist, sie selbst zu gestalten."',
            '"Gib jedem Tag die Chance, der schönste deines Lebens zu werden."',
            '"Wer kämpft, kann verlieren. Wer nicht kämpft, hat schon verloren."',
            '"Die reinste Form des Wahnsinns ist es, alles beim Alten zu belassen und zu hoffen, dass sich etwas ändert."',
            '"Es ist nicht zu wenig Zeit, die wir haben, sondern es ist zu viel Zeit, die wir nicht nutzen."'
        ];

        function wechsleSpruch() {
            var stunde = new Date().getHours();
            var index = stunde % zitate.length;
            document.getElementById('zitat-text').innerHTML = zitate[index];
        }

        // Intervalle aktivieren
        setInterval(aktualisiereUhr, 1000);
        setInterval(wechsleSpruch, 3600000);
        
        // Sofortstarts
        aktualisiereUhr();
        wechsleSpruch();
    </script>

</body>
</html>
